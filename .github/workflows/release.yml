name: "Release Orbit App"

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            os: 'linux'
          - platform: 'windows-latest'
            os: 'windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf zip

      - name: Install project dependencies
        run: npm ci

      - name: Package GNOME Shell Extension
        if: matrix.os == 'linux'
        run: |
          chmod +x scripts/bundle-extension.sh
          ./scripts/bundle-extension.sh

      - name: Build Tauri App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Orbit ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          retryAttempts: 3
          uploadPlainBinary: true
          releaseBody: |
            ## Orbit Productivity Dashboard (Linux & Windows)
            
            ### Linux Downloads:
            - **AppImage**: Universal portable Linux executable
            - **Debian / Ubuntu**: `.deb` package
            - **Fedora / RHEL**: `.rpm` package
            - **GNOME Shell Extension**: `orbit-panel@focusisland.org.zip`

            ### Windows Downloads:
            - **Windows Installer**: `.msi` and `.exe` (NSIS setup installer)

            ### Desktop Hotkeys & Controls:
            - **Global Shortcut**: Press `Ctrl+Alt+O` or `Alt+Shift+O` anywhere to toggle Orbit.
            - **System Tray**: Left-click tray icon to show/hide, right-click for quick menu.
            - **GNOME Top Bar (Linux)**: Click the center panel indicator to toggle.

      - name: Upload GNOME Extension Zip to Release
        uses: softprops/action-gh-release@v2
        if: matrix.os == 'linux' && startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-release/orbit-panel@focusisland.org.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
