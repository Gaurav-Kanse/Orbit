name: "Release Orbit App"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf zip

      - name: Install project dependencies
        run: npm ci

      - name: Package GNOME Shell Extension
        run: |
          chmod +x scripts/bundle-extension.sh
          ./scripts/bundle-extension.sh

      - name: Build Tauri App & Create Release
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Orbit ${{ github.ref_name }}'
          releaseBody: |
            ## Orbit Productivity Dashboard for GNOME Desktop
            
            ### Package Downloads
            - **AppImage**: Portable Linux executable (Works on Ubuntu, Fedora, Debian, Arch)
            - **Debian / Ubuntu**: `.deb` package
            - **Fedora / RHEL**: `.rpm` package
            - **GNOME Extension**: `orbit-panel@focusisland.org.zip`

            ### Installation Instructions
            1. Install the Orbit app package (`.deb`, `.rpm`, or run `.AppImage`).
            2. Download `orbit-panel@focusisland.org.zip` and extract to `~/.local/share/gnome-shell/extensions/orbit-panel@focusisland.org`.
            3. Enable extension via `gnome-extensions enable orbit-panel@focusisland.org`.
          releaseDraft: false
          prerelease: false

      - name: Upload GNOME Extension Zip to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-release/orbit-panel@focusisland.org.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
